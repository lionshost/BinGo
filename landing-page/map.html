<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=http://127.0.0.1:5000/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển hướng tới Hanoi Trash Map</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0fdf4, #ecfeff);
            color: #0f172a;
        }
        .box {
            text-align: center;
            padding: 32px 40px;
            border-radius: 18px;
            background: rgba(255,255,255,0.85);
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        }
        a {
            color: #16a34a;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Đang chuyển tới Hanoi Trash Map...</h2>
        <p>
            Nếu trang không tự chuyển, vui lòng nhấn
            <a href="http://127.0.0.1:5000/">vào đây</a>
        </p>
    </div>

    <script>
        window.location.href = "http://127.0.0.1:5000/";
    </script>
</body>
</html>
