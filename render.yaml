# Render Blueprint cho backend BinGo (New → Blueprint → chọn repo).
# Các biến sync:false sẽ được Render hỏi khi tạo service; không ghi khóa thật vào file này.
services:
  - type: web
    name: bingo-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: VIETMAP_TILEMAP_KEY
        sync: false
      - key: VIETMAP_SERVICES_KEY
        sync: false
      - key: VIETMAP_VEHICLE
        value: car
      - key: VIETMAP_TRUCK_WEIGHT_KG
        value: ""
      # Gemini chỉ là dự phòng khi CV (models/trashscan8s.onnx) không đủ tin cậy; để trống = tắt.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Bắt buộc ở production (thiếu thì server không khởi động). Render tự sinh chuỗi ngẫu nhiên;
      # đổi giá trị này sẽ đăng xuất mọi phiên đang có.
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TOKEN_DAYS
        value: "7"
      # OAuth client ID (Web) của Google; để trống = ẩn nút "Tiếp tục với Google".
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Email Google được cấp quyền admin, cách nhau dấu phẩy.
      - key: ADMIN_EMAILS
        sync: false
